<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#36e06f" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0c0c18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="95%" cy="100%" r="60%">
      <stop offset="0%"  stop-color="#4aa3ff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0c0c18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0c18"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <g transform="translate(80 92)" font-family="Courier New, monospace">
    <text font-size="42" font-weight="700" fill="#dde0f0" letter-spacing="-1">
      claw<tspan fill="#36e06f">_</tspan>
    </text>
    <text x="0" y="32" font-size="16" fill="#7078a0" letter-spacing="2">
      GETCLAW.SITE
    </text>
  </g>

  <g transform="translate(1120 100)" text-anchor="end"
     font-family="Courier New, monospace" font-size="16" fill="#36e06f"
     letter-spacing="3">
    <rect x="-260" y="-22" width="260" height="38" rx="19"
          fill="#0c0c18" stroke="#36e06f" stroke-opacity="0.45"/>
    <text x="-130" y="4" text-anchor="middle">PURE POSIX SH · MIT</text>
  </g>

  <g font-family="-apple-system, Helvetica, Arial, sans-serif" letter-spacing="-3">
    <text x="80" y="250" font-weight="700" font-size="86" fill="#dde0f0">
      An LLM REPL that runs
    </text>
    <text x="80" y="344" font-weight="700" font-size="86" fill="#36e06f">
      on any Linux box.
    </text>
  </g>

  <text x="80" y="398" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="24" fill="#7078a0" letter-spacing="-0.5">
    Shell tool calls · Rolling memory · Mentor mode · Zero deps
  </text>

  <g transform="translate(80 450)">
    <rect x="0" y="6" width="1040" height="76" rx="14"
          fill="#000" fill-opacity="0.35"/>
    <rect x="0" y="0" width="1040" height="76" rx="14"
          fill="#111120" stroke="#36e06f" stroke-opacity="0.4" stroke-width="2"/>

    <circle cx="28" cy="38" r="6" fill="#ff4b4b"/>
    <circle cx="48" cy="38" r="6" fill="#f9c74f"/>
    <circle cx="68" cy="38" r="6" fill="#36e06f"/>

    <text x="100" y="46" font-family="Courier New, monospace" font-size="22">
      <tspan fill="#7078a0">$ </tspan>
      <tspan fill="#36e06f" font-weight="700">wget</tspan>
      <tspan fill="#dde0f0"> -qO /usr/local/bin/claw https://getclaw.site/claw</tspan>
    </text>

    <g transform="translate(940 22)">
      <rect width="80" height="32" rx="7"
            fill="#19193a" stroke="#252545"/>
      <text x="40" y="22" text-anchor="middle"
            font-family="Courier New, monospace" font-size="14"
            fill="#36e06f" letter-spacing="1">INSTALL ›</text>
    </g>
  </g>
</svg>
