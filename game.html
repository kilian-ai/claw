<!doctype html><html><head><meta charset="utf-8"><title>Dot Dash</title><style>body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;text-align:center}canvas{background:#1d1d2b;display:block;margin:20px auto;border:3px solid #555}button{padding:8px 14px;font-size:16px;cursor:pointer}</style></head><body><h1>Dot Dash</h1><p>Use arrow keys or WASD. Collect green dots. Avoid red enemies.</p><p>Score: <span id="score">0</span></p><button onclick="restart()">Restart</button><canvas id="game" width="500" height="350"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),player={x:240,y:165,r:10,speed:4},dot={x:80,y:80,r:7},enemies=[{x:100,y:120,r:12,dx:2.2,dy:1.5},{x:380,y:260,r:12,dx:-1.8,dy:2.1}];let keys={},score=0,alive=true;document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);function rand(a,b){return Math.random()*(b-a)+a}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function moveDot(){dot.x=rand(dot.r,canvas.width-dot.r);dot.y=rand(dot.r,canvas.height-dot.r)}function update(){if(!alive)return;if(keys.arrowup||keys.w)player.y-=player.speed;if(keys.arrowdown||keys.s)player.y+=player.speed;if(keys.arrowleft||keys.a)player.x-=player.speed;if(keys.arrowright||keys.d)player.x+=player.speed;player.x=Math.max(player.r,Math.min(canvas.width-player.r,player.x));player.y=Math.max(player.r,Math.min(canvas.height-player.r,player.y));for(const e of enemies){e.x+=e.dx;e.y+=e.dy;if(e.x<e.r||e.x>canvas.width-e.r)e.dx*=-1;if(e.y<e.r||e.y>canvas.height-e.r)e.dy*=-1;if(dist(player,e)<player.r+e.r)alive=false}if(dist(player,dot)<player.r+dot.r){score++;scoreEl.textContent=score;moveDot();if(score%5===0)enemies.push({x:rand(30,canvas.width-30),y:rand(30,canvas.height-30),r:12,dx:rand(-3,3)||2,dy:rand(-3,3)||2})}}function circle(o,c){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);circle(dot,"#36e06f");circle(player,"#4aa3ff");for(const e of enemies)circle(e,"#ff4b4b");if(!alive){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="white";ctx.textAlign="center";ctx.font="36px Arial";ctx.fillText("Game Over!",canvas.width/2,canvas.height/2-10);ctx.font="18px Arial";ctx.fillText("Click Restart to play again",canvas.width/2,canvas.height/2+25)}}function loop(){update();draw();requestAnimationFrame(loop)}function restart(){player.x=240;player.y=165;score=0;scoreEl.textContent=score;alive=true;enemies.length=0;enemies.push({x:100,y:120,r:12,dx:2.2,dy:1.5},{x:380,y:260,r:12,dx:-1.8,dy:2.1});moveDot()}moveDot();loop();</script></body></html>
